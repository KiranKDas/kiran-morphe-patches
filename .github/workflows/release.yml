name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version already committed through a pull request, for example 1.4.99'
        required: true
        type: string
      app_area:
        description: 'Affected app or area, for example Boost for Reddit. The heading is generated automatically.'
        required: true
        type: string
      changes:
        description: 'Concrete changes, one item per line. Bullets and headings are generated automatically.'
        required: true
        type: string
      user_impact:
        description: 'User-visible impact in plain text. The heading is generated automatically.'
        required: true
        type: string
      issue_number:
        description: 'Optional GitHub issue number without #'
        required: false
        default: ''
        type: string
      confirm:
        description: 'Type MORPHE_RELEASE_FROM_PROTECTED_MAIN'
        required: true
        type: string

concurrency:
  group: morphe-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish merged Morphe release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      APP_AREA: ${{ inputs.app_area }}
      CHANGES: ${{ inputs.changes }}
      USER_IMPACT: ${{ inputs.user_impact }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      CONFIRM: ${{ inputs.confirm }}
      RELEASE_COMMIT: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate protected-main dispatch
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRM" = "MORPHE_RELEASE_FROM_PROTECTED_MAIN"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$APP_AREA"
          test -n "$CHANGES"
          test -n "$USER_IMPACT"
          test -z "$ISSUE_NUMBER" || [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]

          TAG="morphe-patches-${VERSION##*.}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"
          echo "TAG=$TAG"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT"

      - name: Checkout exact main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compose and validate release notes
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes-$VERSION.md"

          ARGS=(
            python3 scripts/compose-release-notes.py
            --version "$VERSION"
            --app-area "$APP_AREA"
            --changes "$CHANGES"
            --user-impact "$USER_IMPACT"
            --output "$NOTES_FILE"
          )

          if test -n "$ISSUE_NUMBER"; then
            ARGS+=(--issue-number "$ISSUE_NUMBER")
          fi

          "${ARGS[@]}"

          python3 scripts/validate-release-notes.py \
            --notes-file "$NOTES_FILE" \
            --version "$VERSION" \
            --human-input-only

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_INPUT_VALIDATION=PASS"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '17.0.19+10'

      - name: Install ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version

      - name: Verify project contracts
        run: ./tools/check-project-contracts.sh

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Validate release signing config
        continue-on-error: true
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"
          test -n "$GPG_FINGERPRINT"

      - name: Import GPG key
        continue-on-error: true
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ vars.GPG_FINGERPRINT }}

      - name: Configure release Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "$(git config --local user.name)" = "github-actions[bot]"
          test "$(git config --local user.email)" = "41898282+github-actions[bot]@users.noreply.github.com"
          git var GIT_COMMITTER_IDENT

      - name: Build patch bundle and catalog
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :patches:buildAndroid generatePatchesList -Pversion="$VERSION" --no-daemon

      - name: Publish from protected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          # Contract marker: --protected-main-commit "$RELEASE_COMMIT"

          MPP_FILE=$(find patches/build/libs -name "*.mpp" | head -n 1)
          if [ -z "$MPP_FILE" ] || [ ! -f "$MPP_FILE" ]; then
            echo "ERROR: MPP file not found in patches/build/libs"
            exit 1
          fi

          MPP_NAME=$(basename "$MPP_FILE")
          MPP_SHA256=$(sha256sum "$MPP_FILE" | awk '{print $1}')
          echo "$MPP_SHA256  $MPP_NAME" > "${MPP_FILE}.sha256"
          echo "Built MPP: $MPP_NAME with SHA256: $MPP_SHA256"

          UPLOAD_FILES=("$MPP_FILE" "${MPP_FILE}.sha256")

          if [ -n "${GPG_FINGERPRINT:-}" ] && command -v gpg >/dev/null 2>&1 && gpg --list-secret-keys | grep -q "sec"; then
            echo "Signing MPP with GPG..."
            gpg --batch --yes --armor --detach-sign --output "${MPP_FILE}.asc" "$MPP_FILE"
            UPLOAD_FILES+=("${MPP_FILE}.asc")
          fi

          python3 -c "
          import json, datetime
          bundle_data = {
              'version': '$VERSION',
              'created_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'description': 'Morphe patch bundle with Infinity+, Boost, Imgur, and Sync support\n',
              'download_url': f'https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MPP_NAME}',
              'signature_download_url': f'https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${MPP_NAME}.asc',
              'sha256': '$MPP_SHA256'
          }
          with open('patches-bundle.json', 'w') as f:
              json.dump(bundle_data, f, indent=2)
          "

          UPLOAD_FILES+=("patches-list.json" "patches-bundle.json")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading updated assets..."
            gh release upload "$TAG" "${UPLOAD_FILES[@]}" --clobber
          else
            echo "Creating release $TAG for $VERSION..."
            gh release create "$TAG" \
              "${UPLOAD_FILES[@]}" \
              --target "$RELEASE_COMMIT" \
              --title "Morphe patch bundle $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
          echo "Release publication succeeded for $TAG ($VERSION)!"
